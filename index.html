<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Segundo Bimestre</title>
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Exercício 1</h2>
    <label for="base">Digite a medida da base:</label>
    <input 
        type="number"
        id="base"
        name="base"
        min="0"
        step="0.01"
        placeholder="Ex: 30.50">

    <br><br>

    <label for="altura">Digite a medida da altura:</label>
    <input 
        type="number" 
        name="altura" 
        id="altura"
        min="0"
        step="0.01"
        placeholder="Ex: 84.25">

    <br><br>    

    <button id="btnCalcArea">Calcular Área</button>

    <p id="medArea"></p>



    <br><br><br><br><br>



    <h2>Exercício 2</h2>
    <label for="qtdCavalos">Digite o número de cavalos:</label>
    <input 
        type="number" 
        name="qtdCavalos" 
        id="qtdCavalos"
        min="0"
        placeholder="8">

    <br><br>

    <button id="btnFerraduras">Calcular ferraduras</button>

    <p id="qtdFerraduras"></p>



    <br><br><br><br><br>



    <h2>Exercício 3</h2>
    <label for="qtdPaes">Digite a quantidade de pães vendidos:</label>
    <input 
        type="number"
        id="qtdPaes"
        name="qtdPaes"
        min="0"
        placeholder="41">

    <br><br>

    <label for="qtdBroas">Digite a quantidade de broas vendidas:</label>
    <input 
        type="number"
        id="qtdBroas"
        name="qtdBroas"
        min="0"
        placeholder="5">

    <br><br>

    <button id="btnValEPoup">Realizar calculos</button>

    <p id="valVendPao"></p>
    <p id="valVendBroa"></p>
    <p id="valVendTot"></p>
    <p id="valPoupanca"></p>



    <br><br><br><br><br>



    <h2>Exercício 4</h2>
    <label for="nome">Qual o seu nome?</label>
    <input 
        type="text"
        id="nome"
        name="nome"
        placeholder="Maria">

    <br><br>

    <label for="qtdAnos">Qual a sua idade?</label>
    <input 
        type="number"
        id="qtdAnos"
        name="qtdAnos"
        min="0"
        placeholder="20">

    <br><br>

    <button id="btnDias">Calcular dias vividos</button>

    <p id="qtdDiasVividos"></p>



    <br><br><br><br><br>



    <h2></h2>


















</body>
</html>
